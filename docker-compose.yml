services:
  # 1. Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: phonestore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PhoneStoreDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-PhoneStoreDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - phonestore_net

  # 2. Backend: C# .NET 10 Web API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phonestore_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=PhoneStoreDB;Username=postgres;Password=postgres}
      Jwt__Key: ${Jwt__Key:-PhoneStoreManagementSystem_SuperSecretKey_2026_AspNetCore10_StrongSecretKey!}
      Jwt__Issuer: ${Jwt__Issuer:-PhoneStoreAPI}
      Jwt__Audience: ${Jwt__Audience:-PhoneStoreClient}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes:-1440}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - phonestore_net

  # 3. Frontend: Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phonestore_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phonestore_net

volumes:
  postgres_data:
    driver: local

networks:
  phonestore_net:
    driver: bridge
