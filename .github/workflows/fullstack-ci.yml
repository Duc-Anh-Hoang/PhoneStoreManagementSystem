name: Fullstack Integration CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/fullstack-ci.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  e2e-compose-test:
    name: Docker Compose Full Stack Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          cp .env.example .env
          sed -i 's/FRONTEND_PORT=80/FRONTEND_PORT=8088/g' .env

      - name: Build and Start Services
        run: |
          docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend and postgres healthchecks..."
          for i in {1..30}; do
            BACKEND_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' phonestore_backend 2>/dev/null || echo "starting")
            POSTGRES_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' phonestore_postgres 2>/dev/null || echo "starting")
            echo "Attempt $i: Backend=$BACKEND_HEALTH, Postgres=$POSTGRES_HEALTH"
            if [ "$BACKEND_HEALTH" = '"healthy"' ] && [ "$POSTGRES_HEALTH" = '"healthy"' ]; then
              echo "Services are healthy!"
              break
            fi
            sleep 3
          done

      - name: Test Endpoints
        run: |
          echo "Testing Frontend HTTP 200..."
          curl -f http://localhost:8088/ || exit 1

          echo "Testing Backend Direct Healthcheck..."
          curl -f http://localhost:8080/api/health || exit 1

          echo "Testing Frontend Nginx Proxy to Backend /api/mathang..."
          curl -f http://localhost:8088/api/mathang || exit 1

      - name: Display container logs if failed
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs phonestore_backend
          echo "=== Postgres Logs ==="
          docker logs phonestore_postgres
          echo "=== Frontend Logs ==="
          docker logs phonestore_frontend

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
