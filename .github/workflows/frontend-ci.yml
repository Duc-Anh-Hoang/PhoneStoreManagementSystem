name: Frontend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: Validate Frontend Files & Nginx Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Core Files Existence
        run: |
          test -f frontend/index.html || { echo "index.html missing"; exit 1; }
          test -f frontend/admin.html || { echo "admin.html missing"; exit 1; }
          test -f frontend/nginx.conf || { echo "nginx.conf missing"; exit 1; }
          test -f frontend/Dockerfile || { echo "Dockerfile missing"; exit 1; }
          echo "All core frontend files are present."

      - name: Validate JSON syntax
        run: |
          if [ -f frontend/home-config.json ]; then
            python3 -m json.tool frontend/home-config.json > /dev/null || exit 1
            echo "home-config.json syntax is valid."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: phonestore-frontend:test
          load: true

      - name: Test Nginx Configuration Syntax
        run: |
          docker run --rm --add-host backend:127.0.0.1 phonestore-frontend:test nginx -t

  publish-ghcr:
    name: Publish to GHCR
    needs: validate-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
