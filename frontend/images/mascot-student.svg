<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Cute Student Mascot with Graduation Cap & Book -->
  <g transform="translate(2, 2)">
    <!-- Shadow -->
    <ellipse cx="22" cy="42" rx="14" ry="2.5" fill="#E2E8F0"/>
    <!-- Body -->
    <circle cx="22" cy="24" r="15" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
    <!-- Blush -->
    <ellipse cx="12" cy="25" rx="2.5" ry="1.5" fill="#FECACA"/>
    <ellipse cx="32" cy="25" rx="2.5" ry="1.5" fill="#FECACA"/>
    <!-- Eyes -->
    <circle cx="16" cy="22" r="2.2" fill="#1E293B"/>
    <circle cx="28" cy="22" r="2.2" fill="#1E293B"/>
    <circle cx="17" cy="21" r="0.8" fill="#FFFFFF"/>
    <circle cx="29" cy="21" r="0.8" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M19 26 Q22 29 25 26" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Graduation Cap (Mũ cử nhân) -->
    <polygon points="22,6 36,12 22,18 8,12" fill="#EF4444"/>
    <polygon points="22,7 34,12 22,17 10,12" fill="#DC2626"/>
    <rect x="18" y="16" width="8" height="4" rx="2" fill="#B91C1C"/>
    <!-- Tassel -->
    <path d="M33 13 L35 22" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="35" cy="23" r="1.5" fill="#F59E0B"/>
    <!-- Book (Quyển sách đỏ) -->
    <path d="M14 36 C18 34, 22 36, 22 36 C22 36, 26 34, 30 36 L30 40 C26 38, 22 40, 22 40 C22 40, 18 38, 14 40 Z" fill="#EF4444"/>
    <path d="M14 35 C18 33, 22 35, 22 35 C22 35, 26 33, 30 35" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
</svg>
