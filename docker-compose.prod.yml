services:
  # 1. Database: PostgreSQL 16 (Production)
  postgres:
    image: postgres:16-alpine
    container_name: phonestore_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PhoneStoreDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-PhoneStoreDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phonestore_prod_net

  # 2. Backend: C# .NET 10 Web API (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phonestore_backend_prod
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=PhoneStoreDB;Username=postgres;Password=postgres_secure_pass_2026}
      Jwt__Key: ${Jwt__Key:-PhoneStoreManagementSystem_SuperSecretKey_2026_AspNetCore10_StrongSecretKey!}
      Jwt__Issuer: ${Jwt__Issuer:-PhoneStoreAPI}
      Jwt__Audience: ${Jwt__Audience:-PhoneStoreClient}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes:-1440}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - phonestore_prod_net

  # 3. Frontend: Nginx Reverse Proxy (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phonestore_frontend_prod
    restart: always
    ports:
      - "${PROD_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phonestore_prod_net

volumes:
  postgres_prod_data:
    driver: local

networks:
  phonestore_prod_net:
    driver: bridge
